name: Publish to npm

on:
  workflow_dispatch: {}

permissions:
  contents: write
  # Lets this job request a short-lived GitHub OIDC token, which npm
  # exchanges for a publish credential — see "Trusted Publisher" setup
  # for each package on npmjs.com.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1+; the version bundled with this
      # runner's Node is older. Pinned to the 11.x line (not `@latest`) so a
      # future npm major bump doesn't silently raise the Node engine
      # requirement again.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # Nothing goes out unverified.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # Publishes each package whose version isn't on npm yet, with
      # provenance (a verifiable "built on GitHub Actions from this commit"
      # attestation). npm authenticates with trusted publishing only (each
      # package's Trusted Publisher on npmjs.com: Amalmktk/react-render-pulse,
      # publish.yml). No token is passed: when one is, npm publishes with it
      # instead, and a token without 2FA bypass gets a 404.
      - run: node scripts/publish-packages.mjs
        env:
          NPM_CONFIG_PROVENANCE: "true"
          # npm only explains a failed trusted-publishing exchange at verbose
          # level ("oidc Failed token exchange request with body message: ...").
          NPM_CONFIG_LOGLEVEL: verbose

      - run: git push --tags
