name: Publish to npm

on:
  workflow_dispatch: {}

permissions:
  contents: write
  # Lets this job request a short-lived GitHub OIDC token, which npm
  # exchanges for a publish credential — see "Trusted Publisher" setup
  # for each package on npmjs.com. No NPM_TOKEN secret needed.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1+; the version bundled with this
      # runner's Node is older. Pinned to the 11.x line (not `@latest`) so a
      # future npm major bump doesn't silently raise the Node engine
      # requirement again.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # `changeset publish` publishes every package whose version isn't on npm
      # yet, running each package's prepublishOnly (typecheck + test + build)
      # first, so nothing goes out unverified. Provenance attaches a
      # verifiable "built on GitHub Actions from this commit" attestation.
      - run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # Tags each published version (e.g. react-render-pulse@1.1.0).
      - run: git push --follow-tags
